[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "solarstrat"
version = "0.1.0"
description = "Speed planning and Monte Carlo risk analysis for a solar car race"
readme = "README.md"
license = "MIT"
authors = [{ name = "Ali Eren Dag" }]
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "matplotlib"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
